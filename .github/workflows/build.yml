name: Build Package

on:
  push:
    branches: [ main ]
    tags:
    - '*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    # Needed to create releases with the default token
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
    # Generic destination builds a universal binary (x86_64 + arm64).
    # Runners have no signing certificate, so sign ad-hoc instead of with the development team.
    - name: Build (macOS 12.0+, universal)
      run: xcodebuild clean build -scheme LayoutSwitcherPack -destination 'generic/platform=macOS' -derivedDataPath ${{ github.workspace }}/build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=
    # Releases need a tag, so skip them for branch pushes and pull requests.
    # Zip only the app bundle, ditto keeps its code signature intact.
    - name: Archive Release
      if: startsWith(github.ref, 'refs/tags/')
      run: ditto -c -k --keepParent build/Build/Products/Release/LayoutSwitcher.app LayoutSwitcher.zip
    - name: Upload Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "LayoutSwitcher.zip"
        token: ${{ secrets.GITHUB_TOKEN }}
